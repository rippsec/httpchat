[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "httpchat"
version = "0.1.0"
description = "Chat HTTP para red local (solo stdlib)"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
httpchat = "httpchat.server:main"

[tool.setuptools]
packages = ["httpchat", "chat"]
